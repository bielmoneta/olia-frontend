<div class="pagina-login">

  <main class="conteudo-login">

    <div class="area-titulo">
      <div class="avatar-escola"><img src="assets/imagens/icon-escola.png" alt="Escola"></div>
      <h2>Entrar como Escola</h2>
      <p>Acesse o painel da instituição</p>
    </div>

    <div class="card-login">
      <form>
        <label>E-mail</label>
        <div class="campo-input">
          <span class="icone-campo"><img src="assets/imagens/icon-email.png" alt="Icone Email"></span>
          <input type="email" placeholder="seu@email.com" name="email" [(ngModel)]="loginData.email">
        </div>

        <label>Senha</label>
        <div class="campo-input">
          <span class="icone-campo"><img src="assets/imagens/icon-senha.png" alt="Icone Senha"></span>
          <input type="password" placeholder="••••••••" name="senha" [(ngModel)]="loginData.senha">
        </div>

        <div class="esqueci-senha">
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="button" class="btn-entrar" (click)="fazerLogin()">Entrar</button>
      </form>

      <div class="divisoria">
        <p>Ainda não tem uma conta?</p>
      </div>

      <button type="button" class="btn-cadastrar" routerLink="/cadastro-escola">Cadastre-se</button>

    </div>
  </main>
</div>
