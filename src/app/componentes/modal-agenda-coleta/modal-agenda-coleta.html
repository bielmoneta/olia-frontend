<div class="overlay" (click)="fecharModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <div class="cabecalho">
      <h3>Solicitar Coleta</h3>
      <button class="btn-close" (click)="fecharModal()">&times;</button>
    </div>
    <p class="descricao">Informe a quantidade estimada de óleo e a data preferida</p>

    <div class="form-group">
      <label>Quantidade Estimada (litros)</label>
      <input type="number" [(ngModel)]="quantidade" placeholder="Ex: 50" class="input-verde">
    </div>

    <div class="form-group">
      <label>Data Preferida</label>
      <input type="date" [(ngModel)]="dataPreferida" class="input-bege">
    </div>

    <div class="botoes-acao">
      <button class="btn-cancelar" (click)="fecharModal()">Cancelar</button>
      <button class="btn-solicitar" (click)="solicitar()">Solicitar</button>
    </div>

  </div>
</div>
