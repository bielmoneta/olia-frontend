<div class="pagina-cadastro">
  <main class="conteudo-central">

    <div class="area-titulo">
      <div class="icon-usuario">
        <img src="assets/imagens/icon-usuario.png" alt="Usuário">
      </div>
      <h2>Cadastro de Usuário</h2>
      <p>Preencha seus dados para começar a descartar óleo de forma sustentável</p>
    </div>

    <div class="card-cadastro">
      <form>
        <h3 class="titulo-secao">Dados Pessoais</h3>

        <label> Nome Completo</label>
        <div class="campo-input">
          <span class="icone-campo-usuario"><img src="assets/imagens/icon-usuariocinza.png" alt="Usuário Icon"></span>
          <input type="text" placeholder="Seu nome completo" name="nome" [(ngModel)]="usuario.nome">
        </div>

        <div class="linha-dupla">
          <div class="campo-metade">
            <label>CPF</label>
            <div class="campo-input">
              <span class="icone-campo"><img src="assets/imagens/icon-cpf.png" alt="CPF"></span>
              <input type="text" placeholder="000.000.000-00" name="cpf" [(ngModel)]="usuario.cpf">
            </div>
          </div>
          <div class="campo-metade">
            <label>Telefone</label>
            <div class="campo-input">
              <span class="icone-campo-telefone"><img src="assets/imagens/icon-telefone.png" alt="Telefone"></span>
              <input type="tel" placeholder="(00) 00000-0000" name="telefone" [(ngModel)]="usuario.telefone">
            </div>
          </div>
        </div>

        <hr class="separador">

        <h3 class="titulo-secao">Endereço</h3>
        <label>Endereço completo</label>
        <div class="campo-input">
          <span class="icone-campo-endereco"><img src="assets/imagens/icon-endereco.png" alt="Endereço Icon"></span>
          <input type="text" placeholder="Rua, número, complemento" name="endereco" [(ngModel)]="usuario.endereco.logradouro">
        </div>

        <div class="linha-dupla">
          <div class="campo-metade">
            <label>Bairro</label>
            <div class="campo-input">
              <input type="text" placeholder="Seu bairro" name="bairro" [(ngModel)]="usuario.endereco.bairro">
            </div>
          </div>
          <div class="campo-metade">
            <label>Cidade</label>
            <div class="campo-input">
              <input type="text" placeholder="Sua cidade" name="cidade" [(ngModel)]="usuario.endereco.cidade">
            </div>
          </div>
        </div>

        <hr class="separador">

        <h3 class="titulo-secao">Programa Social</h3>
        <div class="caixa-bolsa-familia">
          <input type="checkbox" id="bolsaFamilia" name="bolsaFamilia" [(ngModel)]="usuario.temBolsaFamilia">
          <label for="bolsaFamilia" class="label-checkbox">
            <strong>Sou beneficiário do Bolsa Família</strong>
            <span>Necessário para receber sabão ecológico como recompensa</span>
          </label>
        </div>

        @if (usuario.temBolsaFamilia) {
        <div class="campo-aparecendo">
          <label>Número do Bolsa Família (NIS)</label>
          <div class="campo-input">
            <input type="text" placeholder="00000000000" name="nis" [(ngModel)]="usuario.numeroNis">
          </div>
        </div>
        }

        <hr class="separador">

        <h3 class="titulo-secao">Dados de Acesso</h3>
        <label>E-mail</label>
        <div class="campo-input">
          <span class="icone-campo-email"><img src="assets/imagens/icon-email.png" alt="Email"></span>
          <input type="email" placeholder="seu@email.com" name="email" [(ngModel)]="usuario.email">
        </div>

        <div class="linha-dupla">
          <div class="campo-metade">
            <label>Senha</label>
            <div class="campo-input">
              <span class="icone-campo"><img src="assets/imagens/icon-senha.png" alt="Senha"></span>
              <input type="password" placeholder="••••••••" name="senha" [(ngModel)]="usuario.senha">
            </div>
          </div>
          <div class="campo-metade">
            <label>Confirmar senha</label>
            <div class="campo-input">
              <span class="icone-campo"><img src="assets/imagens/icon-senha.png" alt="Senha"></span>
              <input type="password" placeholder="••••••••" name="confirmarSenha" [(ngModel)]="usuario.confirmarSenha">
            </div>
          </div>
        </div>

        <button type="button" (click)="cadastrar()" class="btn-cadastro" routerLink="/login-usuario">Criar Conta</button>

      </form>
    </div>
  </main>
</div>
