<div class="pagina-login">

  <main class="conteudo-login">

    <div class="area-titulo">
      <div class="avatar-usuario"><img src="assets/imagens/icon-usuario.png" alt="Usuario"></div>
      <h2>Entrar como Usuário</h2>
      <p>Acesse sua conta para descartar óleo e ganhar recompensas</p>
    </div>

    <div class="card-login">
      <form>
        <label>E-mail</label>
        <div class="campo-input">
          <span class="icone-campo"><img src="assets/imagens/icon-email.png" alt="Icone Email"></span> <input type="email" placeholder="seu@email.com">
        </div>

        <label>Senha</label>
        <div class="campo-input">
          <span class="icone-campo"><img src="assets/imagens/icon-senha.png" alt="Icone Senha"></span> <input type="password" placeholder="••••••••">
        </div>

        <div class="esqueci-senha">
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="button" class="btn-entrar">Entrar</button>
      </form>

        <div class="divisoria">
          <p>Ainda não tem uma conta?</p>
        </div>

      <button type="button" class="btn-cadastrar" routerLink="/cadastro-usuario">Cadastre-se</button>

    </div>
  </main>
</div>
