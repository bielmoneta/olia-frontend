<header class="olia-cabecalho" [class.alinhado-esquerda]="isPaginaLogin()">

  @if (isPaginaLogin()) {
    <a routerLink="/" class="botao-voltar">
      <span class="seta"><img src="assets/imagens/icon-setavoltar.png" alt=""></span>
    </a>
  }

  <div class="container-logo">
    <img src="assets/imagens/olia-icon.jpg" alt="Logo OLIA" class="logo">

    @if (isPaginaLogin()) {
      <span class="texto-olia">OLIA</span>
    }
  </div>

</header>
