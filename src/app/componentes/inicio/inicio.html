<main class="inicio-container">

  <section class="secao-heroi">
    <h1>Bem-vindo ao OLIA</h1>
    <p>Facilitamos o descarte de óleo usado e recompensamos quem cuida do meio ambiente</p>
  </section>

  <section class="secao-icones">
    <div class="icone-item">
      <img src="assets/images/icon-descarte.png" alt="Descarte Consciente">
      <span>Descarte Consciente</span>
    </div>
    <div class="icone-item">
      <img src="assets/images/icon-transformacao.png" alt="Transformação">
      <span>Transformação</span>
    </div>
    <div class="icone-item">
      <img src="assets/images/icon-sustentabilidade.png" alt="Sustentabilidade">
      <span>Sustentabilidade</span>
    </div>
  </section>

  <section class="secao-perfis">

    <button class="cartao-perfil cartao-usuario">
      <div class="icone-container">
        <img src="assets/images/icon-usuario.png" alt="Ícone Usuário">
      </div>
      <div class="texto-container">
        <strong>Sou Usuário</strong>
        <span>Descarte óleo e ganhe recompensas</span>
      </div>
    </button>

    <button class="cartao-perfil cartao-escola">
      <div class="icone-container">
        <img src="assets/images/icon-escola.png" alt="Ícone Escola">
      </div>
      <div class="texto-container">
        <strong>Sou Escola</strong>
        <span>Ponto de coleta e educação ambiental</span>
      </div>
    </button>

    <button class="cartao-perfil cartao-governo">
      <div class="icone-container">
        <img src="assets/images/icon-governo.png" alt="Ícone Governo">
      </div>
      <div class="texto-container">
        <strong>Sou Governo</strong>
        <span>Gestão e monitoramento do programa</span>
      </div>
    </button>

  </section>

</main>
